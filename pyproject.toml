[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equialgo-experiments"
version = "0.1.0"
description = "Architecture-independent experiments and measured trial history"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.scripts]
equialgo-trials = "equialgo.trials:main"

[tool.setuptools.packages.find]
where = ["src"]
